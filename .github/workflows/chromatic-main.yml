name: "Chromatic — baseline"

# Keep the accepted visual baseline current. When this runs on main it
# auto-accepts the snapshots so subsequent PRs diff against the latest state
# rather than against a stale baseline.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".storybook/**"
      - "chromatic.config.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/chromatic-main.yml"
  workflow_dispatch:

jobs:
  chromatic-baseline:
    name: Update visual baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          # Full history is required for baseline detection / TurboSnap.
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Publish baseline to Chromatic
        uses: chromaui/action@1bbb581925d2d9782cb7d77122d9becae467def18 # v16
        with:
          # ⚠️ Make sure to configure a `CHROMATIC_PROJECT_TOKEN` repository secret
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          autoAcceptChanges: true
