name: "Chromatic"

# Runs on every non-draft PR. There is deliberately NO `paths:` filter here:
# this is a *required* status check, and a workflow skipped by path filtering
# never creates a check run — leaving "Expected" forever and blocking the
# merge with no way to satisfy it. Always running is fine: TurboSnap keeps
# builds fast, and the main-branch workflow keeps the baseline current so
# diffs stay small.
#
# On draft PRs the job's `if:` skips it, which reports a "Skipped" check —
# that DOES satisfy a required check. Marking the PR ready for review
# re-triggers the workflow (`ready_for_review` event) and the real run happens.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  chromatic:
    name: Run Chromatic
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          # Required by Chromatic so it can compare against the full git history
          # (baseline detection / TurboSnap). Don't lower this.
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Chromatic
        uses: chromaui/action@2a0b63f30233c48591844a46d451b9cf68128186 # v18.7.2
        with:
          # ⚠️ Make sure to configure a `CHROMATIC_PROJECT_TOKEN` repository secret
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Block the PR check when visual changes are detected. Changes are
          # reviewed/accepted in the Chromatic UI, then the baseline is updated
          # by the main-branch workflow on merge.
          exitZeroOnChanges: false
